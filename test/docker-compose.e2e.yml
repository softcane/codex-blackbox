# UNPORTED/DEFERRED: copied baseline from Phase 0A for local stack shape only.
# This still drives fake Anthropic traffic and is not Coditor validation.

services:
  fake-anthropic:
    image: python:3.12-alpine
    command: ["python", "/fake-anthropic.py"]
    volumes:
      - ./test/fake-anthropic.py:/fake-anthropic.py:ro
    expose:
      - "8000"

  envoy:
    volumes:
      - ./test/envoy.e2e.yaml:/etc/envoy/envoy.yaml:ro
    depends_on:
      coditor-core:
        condition: service_healthy
      fake-anthropic:
        condition: service_started

  coditor-core:
    environment:
      - CODITOR_SESSION_TIMEOUT_MINUTES=1

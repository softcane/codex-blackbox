# Phase 5B OpenAI API-key mode override.
# Manual/experimental only: the default docker-compose.yml still mounts the
# copied unported Envoy config. This override does not provide credentials;
# callers must supply Authorization headers themselves when deliberately
# testing against api.openai.com.

services:
  envoy:
    volumes:
      - ./envoy/envoy.openai.yaml:/etc/envoy/envoy.yaml:ro

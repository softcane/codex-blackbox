# Codex Blackbox ChatGPT/Codex subscription Envoy proxy.
# This is the default Codex Blackbox stack route for Codex CLI traffic. Codex is
# pointed at this listener with command-line `chatgpt_base_url` and
# `openai_base_url` overrides; the upstream remains the ChatGPT/Codex backend
# at chatgpt.com.

admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 9901

static_resources:
  listeners:
    - name: chatgpt_codex_listener
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 10000
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: chatgpt_codex_proxy
                codec_type: AUTO
                stream_idle_timeout: 300s
                upgrade_configs:
                  - upgrade_type: websocket

                route_config:
                  name: chatgpt_codex_route
                  virtual_hosts:
                    - name: chatgpt_codex
                      domains: ["*"]
                      routes:
                        - match:
                            path: "/ready"
                          direct_response:
                            status: 200
                            body:
                              inline_string: "ready\n"
                        - match:
                            prefix: "/backend-api/codex/responses/compact"
                          route:
                            cluster: chatgpt_codex_upstream
                            timeout: 300s
                            host_rewrite_literal: chatgpt.com
                          typed_per_filter_config:
                            envoy.filters.http.ext_proc:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExtProcPerRoute
                              disabled: true
                        - match:
                            prefix: "/backend-api/codex/responses"
                            headers:
                              - name: ":method"
                                string_match:
                                  exact: "GET"
                          direct_response:
                            status: 426
                            body:
                              inline_string: "Codex Blackbox observes HTTP Responses; retry without websocket upgrade\n"
                        - match:
                            prefix: "/backend-api"
                          route:
                            cluster: chatgpt_codex_upstream
                            timeout: 300s
                            host_rewrite_literal: chatgpt.com
                        - match:
                            prefix: "/"
                          direct_response:
                            status: 404
                            body:
                              inline_string: "Codex Blackbox ChatGPT/Codex proxy expects /backend-api paths\n"

                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format:
                        json_format:
                          timestamp: "%START_TIME%"
                          method: "%REQ(:METHOD)%"
                          path: "%REQ(X-ENVOY-ORIGINAL-PATH?:PATH)%"
                          upgrade: "%REQ(UPGRADE)%"
                          status: "%RESPONSE_CODE%"
                          duration_ms: "%DURATION%"
                          bytes_rx: "%BYTES_RECEIVED%"
                          bytes_tx: "%BYTES_SENT%"
                          upstream: "%UPSTREAM_HOST%"
                          request_id: "%REQ(X-REQUEST-ID)%"
                          upstream_transport_failure_reason: "%UPSTREAM_TRANSPORT_FAILURE_REASON%"

                http_filters:
                  - name: envoy.filters.http.lua
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
                      inline_code: |
                        function envoy_on_request(handle)
                          local path = handle:headers():get(":path") or ""
                          local method = handle:headers():get(":method") or ""
                          local upgrade = handle:headers():get("upgrade") or ""
                          if method == "GET"
                            and string.sub(path, 1, 28) == "/backend-api/codex/responses"
                            and string.lower(upgrade) == "websocket" then
                            handle:respond(
                              {[":status"] = "426", ["upgrade"] = "websocket"},
                              "Codex Blackbox observes HTTP Responses; retry without websocket upgrade\n"
                            )
                          end
                        end

                  - name: envoy.filters.http.ext_proc
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
                      grpc_service:
                        envoy_grpc:
                          cluster_name: codex_blackbox_ext_proc
                      failure_mode_allow: true
                      message_timeout: 10s
                      processing_mode:
                        request_header_mode: SEND
                        request_body_mode: BUFFERED
                        response_header_mode: SEND
                        response_body_mode: STREAMED

                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: chatgpt_codex_upstream
      type: LOGICAL_DNS
      dns_lookup_family: V4_ONLY
      connect_timeout: 10s
      load_assignment:
        cluster_name: chatgpt_codex_upstream
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: chatgpt.com
                      port_value: 443
      transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
          sni: chatgpt.com
          common_tls_context:
            validation_context:
              trusted_ca:
                filename: /etc/ssl/certs/ca-certificates.crt

    - name: codex_blackbox_ext_proc
      type: STRICT_DNS
      connect_timeout: 1s
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: codex_blackbox_ext_proc
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: codex-blackbox-core
                      port_value: 50051

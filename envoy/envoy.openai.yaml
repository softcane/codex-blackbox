# Coditor OpenAI API-key Envoy proxy.
# EXPERIMENTAL/MANUAL: this routes /v1/responses to api.openai.com for
# API-key-mode testing only. The default stack still uses envoy/envoy.yaml,
# which remains an unported Anthropic-shaped baseline until CLI/runtime wiring
# is deliberately changed.

admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 9901

static_resources:
  listeners:
    - name: openai_api_key_listener
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 10000
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: openai_api_key_proxy
                codec_type: AUTO

                # Responses SSE streaming should remain open while upstream
                # emits events.
                stream_idle_timeout: 300s

                route_config:
                  name: openai_api_key_route
                  virtual_hosts:
                    - name: openai_api
                      domains: ["*"]
                      routes:
                        - match:
                            prefix: "/v1/responses"
                          route:
                            cluster: openai_api_upstream
                            timeout: 300s
                            host_rewrite_literal: api.openai.com

                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format:
                        json_format:
                          timestamp: "%START_TIME%"
                          method: "%REQ(:METHOD)%"
                          path: "%REQ(X-ENVOY-ORIGINAL-PATH?:PATH)%"
                          status: "%RESPONSE_CODE%"
                          duration_ms: "%DURATION%"
                          bytes_rx: "%BYTES_RECEIVED%"
                          bytes_tx: "%BYTES_SENT%"
                          upstream: "%UPSTREAM_HOST%"
                          request_id: "%REQ(X-REQUEST-ID)%"
                          response_flags: "%RESPONSE_FLAGS%"

                http_filters:
                  # ext_proc: send all phases to coditor-core for observation.
                  # coditor-core removes accept-encoding in request_headers so
                  # Responses SSE stays readable to the accumulator.
                  - name: envoy.filters.http.ext_proc
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
                      grpc_service:
                        envoy_grpc:
                          cluster_name: coditor_ext_proc
                      # If coditor-core is down, traffic still flows.
                      failure_mode_allow: true
                      message_timeout: 10s
                      processing_mode:
                        request_header_mode: SEND
                        # Codex request parsing currently expects buffered
                        # plaintext JSON request bodies.
                        request_body_mode: BUFFERED
                        response_header_mode: SEND
                        # CRITICAL: STREAMED so we see SSE chunks individually.
                        response_body_mode: STREAMED

                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: openai_api_upstream
      type: LOGICAL_DNS
      dns_lookup_family: V4_ONLY
      connect_timeout: 10s
      load_assignment:
        cluster_name: openai_api_upstream
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: api.openai.com
                      port_value: 443
      transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
          sni: api.openai.com
          common_tls_context:
            validation_context:
              trusted_ca:
                filename: /etc/ssl/certs/ca-certificates.crt

    # ext_proc: coditor-core gRPC service (HTTP/2 required).
    - name: coditor_ext_proc
      type: STRICT_DNS
      connect_timeout: 1s
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: coditor_ext_proc
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: coditor-core
                      port_value: 50051
